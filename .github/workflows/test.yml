name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  silbe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/silbe
    # Required for `next build` (payload.config.ts loads at module top-level
    # and throws if PAYLOAD_SECRET / DATABASE_URI are missing) and for the
    # Playwright `webServer: pnpm dev` step (same module-load path). Set at
    # job level so any future step inherits without a per-step env block.
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PAYLOAD_PUBLIC_SERVER_URL: ${{ secrets.PAYLOAD_PUBLIC_SERVER_URL }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
      NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
      SHOPIFY_STOREFRONT_PRIVATE_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_PRIVATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Content lint
        run: pnpm lint:content

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      # Snapshots are committed Win32-flavored (developer machine) and have
      # not yet been generated for Linux. CI runs everything except @snapshot
      # specs until we add a Linux baseline-generation job.
      # Calls the dedicated script directly — `pnpm <script> -- <args>` passes
      # `--` literally to Playwright, which reads it as a positional filter
      # regex and reports "No tests found".
      - name: Playwright tests (non-snapshot)
        run: pnpm test:e2e:non-snapshot

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/silbe/playwright-report
          retention-days: 14
