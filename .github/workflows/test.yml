name: test

on:
  push:
    branches: [main]
  # KEIN branches-Filter. Vorher stand hier `branches: [main]`, und damit lief CI
  # NUR fuer PRs gegen main. Gestapelte PRs — deren Base ein anderer Branch ist —
  # loesten den Workflow gar nicht aus, und die PR-Seite zeigt dann keine Checks:
  # kein rotes Kreuz, das auffiele, sondern schlicht nichts.
  #
  # Am 2026-08-14 hatten drei von vier PRs eines Stapels (#81, #82, #83) nie CI
  # gesehen. Sie waren lokal gruen, aber die Gruppe sah geprueft aus, ohne es zu
  # sein — dieselbe Klasse wie ein leerer Glob, der als Bestanden durchgeht.
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Separate job, not a step in `silbe`: it needs no pnpm install and no env, so it
  # finishes in seconds and reports independently. A credential leak should be
  # attributable at a glance, not buried inside a build job that failed for some
  # other reason.
  #
  # Anlass: on 2026-08-06 a real Shopify client secret sat in the working tree of
  # apps/silbe/.env.example — a TRACKED file. It was never committed, but nothing
  # in this repository would have stopped it. There are no git hooks (verified:
  # .git/hooks holds only .sample, no husky, no lefthook, no lint-staged), so CI is
  # the only layer available. Complements GitHub Push Protection, which acts before
  # the push; this acts after it.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail-closed: any match exits non-zero and blocks the job. The script never
      # prints a matched value — a scanner that echoes the secret into a public run
      # log has leaked it a second time.
      - name: Scan tracked files for credentials
        run: bash scripts/scan-secrets.sh --verbose

  silbe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/silbe
    # Required for `next build` (payload.config.ts loads at module top-level
    # and throws if PAYLOAD_SECRET / DATABASE_URI are missing) and for the
    # Playwright `webServer: pnpm dev` step (same module-load path). Set at
    # job level so any future step inherits without a per-step env block.
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PAYLOAD_PUBLIC_SERVER_URL: ${{ secrets.PAYLOAD_PUBLIC_SERVER_URL }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
      NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
      SHOPIFY_STOREFRONT_PRIVATE_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_PRIVATE_TOKEN }}
      # Build-time since the Block-A fix: the PDP prerenders with
      # dynamicParams=false, so getProductByHandle → metafieldIds() runs during
      # `next build` and reads this through brand.config, which throws when unset.
      # Not a secret — it is this brand's Shopify metafield namespace, and this
      # repository IS SILBE. Written plainly rather than as an empty secret, so a
      # fork sees exactly one place to change it.
      EDITORIAL_METAFIELD_NAMESPACE: silbe
      # Build-time seit Leck #1/#4: metadataBase ist ein Modul-Export, sitemap und
      # robots werden im Build erzeugt. Fehlt der Wert, wirft brand.config und der
      # Build geht rot — beabsichtigt. Kein Secret, sondern der Origin dieser Brand.
      # Spiegelt den aktuellen Produktionswert; bei der Migration auf silbe.at hier
      # UND in Vercel ändern.
      METADATA_BASE_URL: https://brainsells-headless.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Content lint
        run: pnpm lint:content

      # The three cheap gates run BEFORE the build on purpose: each takes seconds,
      # `next build` takes minutes. A broken type or a red test should surface in
      # the first minute of a run, not after the slowest step has finished.
      #
      # Until now none of these ran in CI at all — only content-lint, build and
      # Playwright did. That meant the unit suite (145 tests, including the
      # fulfillment provider contract suite from #71) was enforced by nothing:
      # a PR could break it and still go green. The contract suite is the evidence
      # that the provider abstraction holds, so leaving it unenforced would have
      # made that claim rest on whoever remembered to run vitest locally.
      - name: Typecheck
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      # Snapshots are committed Win32-flavored (developer machine) and have
      # not yet been generated for Linux. CI runs everything except @snapshot
      # specs until we add a Linux baseline-generation job.
      # Calls the dedicated script directly — `pnpm <script> -- <args>` passes
      # `--` literally to Playwright, which reads it as a positional filter
      # regex and reports "No tests found".
      - name: Playwright tests (non-snapshot)
        run: pnpm test:e2e:non-snapshot

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/silbe/playwright-report
          retention-days: 14
